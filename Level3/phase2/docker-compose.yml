services:
  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - gateway1
      - gateway2

  gateway1:
    build: ./backend/gateway
    env_file:
      - ./backend/gateway/.env
    environment:
      SERVER_NAME: "1st gateway"
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      PRODUCT_SERVICE_URL: http://product-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
    ports:
      - "8001:8000"
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service

  gateway2:
    build: ./backend/gateway
    env_file:
      - ./backend/gateway/.env
    environment:
      SERVER_NAME: "2nd gateway"
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      PRODUCT_SERVICE_URL: http://product-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
    ports:
      - "8002:8000"

  auth-service:
    build: ./backend/services/auth
    command: ["node", "authServer.js"]
    env_file:
      - ./backend/services/auth/.env
    ports:
      - "5001:3001"

  user-service:
    build: ./backend/services/user
    command: ["node", "userServer.js"]
    env_file:
      - ./backend/services/user/.env
    ports:
      - "5002:3002"

  product-service:
    build: ./backend/services/product
    command: ["node", "productServer.js"]
    env_file:
      - ./backend/services/product/.env
    ports:
      - "5003:3003"

  order-service:
    build: ./backend/services/order
    command: ["node", "orderServer.js"]
    env_file:
      - ./backend/services/order/.env
    ports:
      - "5004:3004"